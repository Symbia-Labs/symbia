name: release-linux

# Builds the static Linux binary and attaches it to the GitHub release for the tag.
# The macOS binary is built, signed and notarized on a Mac and uploaded separately.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload to (for example v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  linux-musl:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      TARGET: x86_64-unknown-linux-musl
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Toolchain
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q musl-tools
          rustup toolchain install 1.91.0 --profile minimal --component clippy
          rustup default 1.91.0
          rustup target add "$TARGET"
      - name: Test
        run: cargo test --release --target "$TARGET"
      - name: Build and package
        run: |
          cargo build --release --target "$TARGET"
          version="${TAG#v}"
          name="symbia-${version}-${TARGET}"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/symbia" README.md LICENSE CHANGELOG.md "dist/$name/"
          strip "dist/$name/symbia"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "ASSET=dist/$name.tar.gz" >> "$GITHUB_ENV"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber

[workspace]
members = ["."]
resolver = "3"

[package]
name = "symbia"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "A signed, hash-chained SQLite ledger of AI agent work, served over MCP."
license = "MIT"
repository = "https://github.com/Symbia-Labs/symbia"
publish = false

[lib]
name = "symbia"
path = "src/lib.rs"

[[bin]]
name = "symbia"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.104"
base64 = "=0.23.1"
ed25519-dalek = "=3.0.0"
getrandom = "=0.4.3"
hex = "=0.4.3"
bytes = "=1.12.1"
futures = "=0.3.34"
globset = "=0.4.20"
grep = "=0.4.1"
http = "=1.5.0"
http-body-util = "=0.1.5"
hyper = { version = "=1.11.1", features = ["server", "http1"] }
hyper-util = { version = "=0.1.20", features = ["tokio", "service"] }
ignore = "=0.4.33"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp"] }
libc = "=0.2.190"
rmcp = { version = "=3.5.1", features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
schemars = "=1.2.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_jcs = "=0.2.0"
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "io-std", "io-util", "net", "signal", "process", "time", "fs"] }

[dev-dependencies]
hyper = { version = "=1.11.1", features = ["client", "http1"] }
rmcp = { version = "=3.5.1", features = ["client", "transport-child-process"] }
tempfile = "=3.27.0"
